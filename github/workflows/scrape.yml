name: ReFooty Encrypted Auto Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-encrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Encrypted Scraper
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          AES_KEY: ${{ secrets.AES_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python main.py

      - name: Commit and Push Encrypted JSON Files
        run: |
          git config --local user.email "bbz36891@gmail.com"
          git config --local user.name "bbz36891-stack"
          git add .
          git commit -m "Auto-update Encrypted JSON Files [skip ci]" || exit 0
          git push
